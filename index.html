<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            text-align: center;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: white;
        }
        button:hover {
            opacity: 0.8;
        }
        #sadBtn {
            background-color: #f44336;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to the Mood Page</h1>
        <button id="happyBtn">Happy</button>
        <button id="sadBtn">Sad</button>
    </div>

    <script>
        document.getElementById('happyBtn').addEventListener('click', function() {
            window.location.href = 'happy.html';
        });

        document.getElementById('sadBtn').addEventListener('click', function() {
            window.location.href = 'sad.html';
        });
    </script>
</body>
</html>
