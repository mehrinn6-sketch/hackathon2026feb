<!DOCTYPE html>
<html>
<head>
  <title>Fortune Teller</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 40px;
    }

    h2 {
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 120px);
      grid-gap: 10px;
      justify-content: center;
      margin-top: 20px;
    }

    .card {
      width: 120px;
      height: 120px;
      background: #f2f2f2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      border-radius: 12px;
      transition: transform 0.3s, background 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
      background: #e0e0e0;
    }

    #message {
      margin-top: 25px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h2>Fortune Teller Game</h2>
<p id="instruction">Choose a number</p>

<div class="grid" id="gameGrid"></div>

<div id="message"></div>

<script>

let step = 1;

const grid = document.getElementById("gameGrid");
const instruction = document.getElementById("instruction");
const message = document.getElementById("message");

function createCards(numbers) {
  grid.innerHTML = "";
  numbers.forEach(num => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerText = num;
    div.onclick = () => handleChoice(num);
    grid.appendChild(div);
  });
}

function handleChoice(choice) {

  if (step === 1) {
    instruction.innerText = "Choose again";
    createCards([1,2,3,4,5,6,7,8]);
    step = 2;
  }

  else if (step === 2) {
    instruction.innerText = "Your fortune:";
    
    const fortunes = [
      "You will score well in exams!",
      "A good opportunity is coming!",
      "You will learn something exciting!",
      "Success is closer than you think!"
    ];

    const random = fortunes[Math.floor(Math.random() * fortunes.length)];
    message.innerText = random;

    grid.innerHTML = "";
  }
}

createCards([1,2,3,4]);

</script>

</body>
</html>
