<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sad Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffe6e6;
        }
        .container {
            text-align: center;
        }
        textarea {
            width: 80%;
            height: 100px;
            margin: 20px 0;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #f44336;
            color: white;
        }
        button:hover {
            opacity: 0.8;
        }
        .columns-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .column {
            width: 80px;
            height: 80px;
            background-color: #f44336;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .column:hover {
            transform: scale(1.05);
            background-color: #d32f2f;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>You are Sad!</h1>
        <p>This is the sad page. We hope you feel better soon!</p>
        <p>Share your sad thoughts here.</p>
        <textarea id="thoughtInput" placeholder="Enter your thought here..."></textarea>
        <div class="columns-container">
            <div class="column" id="col1">1</div>
            <div class="column" id="col2">2</div>
            <div class="column" id="col3">3</div>
            <div class="column" id="col4">4</div>
        </div>
        <button id="backBtn">Back to Home</button>
    </div>

    <script>
        // Unique key for this page's thought
        const thoughtKey = 'thought-sad';

        // Load saved thought on page load
        const thoughtInput = document.getElementById('thoughtInput');
        thoughtInput.value = localStorage.getItem(thoughtKey) || '';

        // Save thought on input change
        thoughtInput.addEventListener('input', (e) => {
            localStorage.setItem(thoughtKey, e.target.value);
        });

        // Add click listeners for columns 1, 2, 3, and 4
        document.getElementById('col1').addEventListener('click', function() {
            window.location.href = 'page1.html';
        });
        document.getElementById('col2').addEventListener('click', function() {
            window.location.href = 'page2.html';
        });
        document.getElementById('col3').addEventListener('click', function() {
            window.location.href = 'page3.html';
        });
        document.getElementById('col4').addEventListener('click', function() {
            window.location.href = 'page4.html';
        });

        // Back button
        document.getElementById('backBtn').addEventListener('click', function() {
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
